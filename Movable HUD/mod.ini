Description=Hold the HUD's footer (the level, class and weight line) and drag to move the HUD anywhere on screen. Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Options lists the new Craft Max add-on; the Steampunk look uses the sharper 2x Steampunk art.
