        <script>
-- Theme check (add-on windows work with the default UI and with the Steampunk
-- UI theme). Steampunk is installed when styles/steampunk.css exists; then this
-- window gets the class sp-theme-steampunk and uses the Steampunk look,
-- otherwise sp-theme-default and the game's own look. SP_THEME says which.
pcall(function()
    local sp = false
    pcall(function()
        local f = io.open('Data/ui/themes/rose/styles/steampunk.css', 'r')
        if f then f:close(); sp = true end
    end)
    SP_THEME = sp and 'steampunk' or 'default'
    local body = document:GetElementById('hud')
    if body then
        body:SetClass('sp-theme-default', not sp)
        body:SetClass('sp-theme-steampunk', sp)
    end
    -- (parts written for the other look stay in the window, hidden)
end)

		<script>
-- (runs only in the default UI look)
if SP_THEME == 'steampunk' then return end
-- Session trackers (EXP Tracker add-on).
-- Every 5 seconds this notes your EXP. Hovering the EXP bar shows EXP per hour
-- (over the last 10 minutes), time to the next level and what this session
-- has earned.
-- Double-click the EXP bar to start a new session. A new
-- character starts a new session by itself. Text only changes while you hover,
-- so nothing is redrawn in the background.
pcall(function()
    local document = document
    local function el(id) return document:GetElementById(id) end
    local STEP, WINDOW = 5, 120          -- seconds per sample, samples kept (10 min)
    local function num(n)
        local neg = n < 0
        local t = string.format('%.0f', math.abs(n))
        t = t:reverse():gsub('(%d%d%d)', '%1,'):reverse():gsub('^,', '')
        return (neg and '-' or '') .. t
    end
    local function span(secs)
        secs = math.floor(secs + 0.5)
        local h, m = math.floor(secs / 3600), math.floor((secs % 3600) / 60)
        if h >= 100 then return 'over 100h' end
        if h > 0 then return h .. 'h ' .. m .. 'm' end
        if m > 0 then return m .. 'm' end
        return secs .. 's'
    end
    local S = nil   -- the session
    local function fresh(v)
        return {name = v.name, ticks = 0, xp = 0, lv = v.lv, exp = v.exp, max = v.max,
                money0 = v.money, money = v.money, hist = {{0, 0, v.money}}}
    end
    local function read()
        local src = el('sp-track')
        if not src then return nil end
        local v = {name = src:GetAttribute('sp-name') or '', lv = tonumber(src:GetAttribute('sp-lv')),
                   exp = tonumber(src:GetAttribute('sp-exp')), max = tonumber(src:GetAttribute('sp-max')),
                   money = tonumber(src:GetAttribute('sp-money'))}
        if not v.lv or not v.exp or not v.max or not v.money or v.name == '' then return nil end
        return v
    end
    local function tick()
        local v = read()
        if not v then return end
        if not S or S.name ~= v.name then S = fresh(v); return end
        -- experience gained since the last sample, counting level-ups
        local gain
        if v.lv > S.lv then
            gain = math.max(0, S.max - S.exp) + v.exp
        elseif v.lv == S.lv then
            gain = v.exp - S.exp
        else
            gain = 0
        end
        S.xp = S.xp + gain
        S.lv, S.exp, S.max, S.money = v.lv, v.exp, v.max, v.money
        S.ticks = S.ticks + 1
        table.insert(S.hist, {S.ticks, S.xp, v.money})
        if #S.hist > WINDOW + 1 then table.remove(S.hist, 1) end
    end
    local function rates()
        local a, b = S.hist[1], S.hist[#S.hist]
        local secs = (b[1] - a[1]) * STEP
        if secs < 60 then return nil end
        return (b[2] - a[2]) * 3600 / secs, (b[3] - a[3]) * 3600 / secs
    end
    local function set(id, text)
        local e = el(id)
        if e then e.inner_rml = text end
    end
    local function show_xp()
        if not S then return end
        local xph = rates()
        if not xph then
            set('sp-xp-rate', 'Per hour: gathering data...')
            set('sp-xp-eta', '')
        else
            set('sp-xp-rate', 'Per hour: ' .. num(math.max(0, xph)))
            if xph > 0 and S.max > 0 then
                set('sp-xp-eta', 'Next level in: ' .. span((S.max - S.exp) * 3600 / xph))
            else
                set('sp-xp-eta', 'Next level in: -')
            end
        end
        set('sp-xp-session', 'This session: +' .. num(math.max(0, S.xp)) .. ' (' .. span(S.ticks * STEP) .. ')')
    end
    -- hover handlers
    local wrap = el('sp-exp-wrap')
    if wrap then
        wrap:AddEventListener('mouseover', function() pcall(show_xp) end)
        wrap:AddEventListener('dblclick', function()
            local v = read()
            if v then S = fresh(v) end
            pcall(show_xp)
        end)
    end
    local timer = el('sp-track-timer')
    local flip = false
    if timer then
        timer:AddEventListener('animationend', function()
            pcall(tick)
            flip = not flip
            timer.style.animation = STEP .. 's ' .. (flip and 'sp-track-tick-b' or 'sp-track-tick-a')
        end)
    end
end)

    end
    -- hover handlers
    local exp_gauge = nil
    do
        local r = el('sp-xp-rate-sp')
        if r then exp_gauge = r.parent_node and r.parent_node.parent_node end
    end
    if exp_gauge then exp_gauge:AddEventListener('mouseover', function() pcall(show_xp) end) end
    local z = el('sp-zulie')
    if z then
        z:AddEventListener('mouseover', function() pcall(show_zuly) end)
        z:AddEventListener('dblclick', function()
            local v = read()
            if v then S = fresh(v) end
            pcall(show_zuly)
        end)
    end
    local timer = el('sp-track-timer')
    local flip = false
    if timer then
        timer:AddEventListener('animationend', function()
            pcall(tick)
            flip = not flip
            timer.style.animation = STEP .. 's ' .. (flip and 'sp-track-tick-b' or 'sp-track-tick-a')
        end)
    end
end)

		<script>
-- Weapon durability refresh (Weapon Refresh add-on). The HUD's weapon slot only
-- reads the weapon's details when the weapon changes, so durability and life
-- lost in a fight didn't show (13/13 in the HUD, 12/13 in the inventory).
-- Every 5 seconds this compares the live numbers; when they change it sets the
-- slot's own values again so the slot reloads. Nothing else is touched.
pcall(function()
    local document = document
    local last = nil
    local function el(id) return document:GetElementById(id) end
    local function check()
        local sp = SP_THEME == 'steampunk' and '-sp' or ''
        local src, slot = el('sp-weapon-src' .. sp), el('sp-weapon-slot' .. sp)
        if not src or not slot then return end
        if SP_ADDON_ON and not SP_ADDON_ON('weapon_refresh') then last = nil; return end
        local key = src:GetAttribute('sp-key') or ''
        local dur = src:GetAttribute('sp-dur') or ''
        local life = src:GetAttribute('sp-life') or ''
        local now = key .. '|' .. dur .. '|' .. life
        if last and now ~= last and key == last:match('^([^|]*)') and key ~= '' and key ~= '0' then
            slot:SetAttribute('item-durability', dur)
            slot:SetAttribute('item-life', life)
            slot:SetAttribute('item-key', '0')
            slot:SetAttribute('item-key', key)
        end
        last = now
    end
    local timer = el('sp-track-timer')
    if timer then
        timer:AddEventListener('animationend', function() pcall(check) end)
    end
end)
		</script>
    <script>
-- HUD Weapon Slot, Movable HUD and Default UI Fixes: the switch script below
-- calls these with on = installed and switched on; they put sp-on-<key> on
-- the HUD, which turns that add-on's styles on.
pcall(function()
    local doc = document
    SP_ADDON_HOOK = SP_ADDON_HOOK or {}
    for _, k in ipairs({'weapon_slot', 'hud_move', 'ui_fixes'}) do
        SP_ADDON_HOOK[k .. '@hud'] = function(on)
            local b = doc:GetElementById('hud')
            if b then b:SetClass('sp-on-' .. k, on) end
        end
    end
end)
    </script>
    <script>
-- Add-on switches (the same script in every add-on window).
-- SP_ADDON_SWITCH exp_tracker
-- SP_ADDON_SWITCH weapon_refresh
-- SP_ADDON_SWITCH weapon_slot
-- SP_ADDON_SWITCH hud_move
-- SP_ADDON_SWITCH ui_fixes
-- An add-on counts as installed while its marker file
-- Data/ui/sp_addons/<key>.txt exists. The launcher copies the marker in with
-- the add-on and takes it out again with it, so a window that several add-ons
-- share only runs the parts of the add-ons that are installed.
-- The on/off switches are in Options > UI > Add-ons and are saved in
-- sp_addons.txt (the Ice UI uses the same file; nobody removes anyone else's
-- lines). This window reads it every 2 seconds. Everything is on by default.
pcall(function()
    local BODY = 'hud'
    -- key, class put on this window while that add-on is off or not installed ('' = none)
    local MINE = {{'exp_tracker', 'sp-exp-off'}, {'weapon_refresh', ''}, {'weapon_slot', ''}, {'hud_move', ''}, {'ui_fixes', ''}}
    local installed = {}
    SP_ADDON_INSTALLED = function(key)
        -- the Steampunk UI theme has every add-on built in
        if SP_THEME == 'steampunk' then return true end
        if installed[key] == nil then
            installed[key] = true      -- if the game won't let the UI read files, assume installed
            pcall(function()
                local f = io.open('Data/ui/sp_addons/' .. key .. '.txt', 'r')
                if f then f:close() else installed[key] = false end
            end)
        end
        return installed[key]
    end
    local flags = {}
    local function read_flags()
        flags = {}
        pcall(function()
            local f = io.open('sp_addons.txt', 'r')
            if not f then return end
            for line in f:lines() do
                local k, v = line:match('^%s*([%w_]+)%s*=%s*(%d)')
                if k then flags[k] = v end
            end
            f:close()
        end)
    end
    -- SP_ADDON_ON(key): installed and not switched off. Reads the switches fresh
    -- unless called with fresh == false.
    SP_ADDON_ON = function(key, fresh)
        if not SP_ADDON_INSTALLED(key) then return false end
        if fresh ~= false then read_flags() end
        return flags[key] ~= '0'
    end
    local doc = document
    local function apply()
        read_flags()
        for _, m in ipairs(MINE) do
            local on = SP_ADDON_ON(m[1], false)
            if m[2] ~= '' then pcall(function() (doc:GetElementById(BODY) or doc):SetClass(m[2], not on) end) end
            -- a script in this window can register SP_ADDON_HOOK['<key>@<body id>'] = function(on) ... end
            local hook = SP_ADDON_HOOK and SP_ADDON_HOOK[m[1] .. '@' .. BODY]
            if hook then pcall(hook, on) end
        end
    end
    apply()
    doc:AddEventListener('show', function() pcall(apply) end)
    doc:AddEventListener('mouseover', function() pcall(apply) end)
    -- repeating 2 second check: two identical animations swapped each time one ends
    pcall(function()
        local timer = doc:GetElementById('sp-switch-timer')   -- the empty div at the end of the body
        local flip = false
        timer:AddEventListener('animationend', function()
            pcall(apply)
            flip = not flip
            timer.style.animation = '2s ' .. (flip and 'sp-switch-tick-b' or 'sp-switch-tick-a')
        end)
    end)
end)
    </script>
