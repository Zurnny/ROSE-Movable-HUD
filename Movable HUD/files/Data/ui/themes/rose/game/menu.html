                from  { opacity: 0.5; image-color: rgba(200, 200, 200, 200); }
                to  { opacity: 1; image-color: rgba(255, 255, 255, 255); }
            }

            {
                src: /data/ui/themes/rose/imgs/sp_addons_menu.dds;
                resolution: 2x;
                sp-addons-menu-n: 0px 0px 68px 60px;
                sp-addons-menu-h: 70px 0px 68px 60px;
                sp-addons-menu-a: 140px 0px 68px 60px;
            }
        </style>
        <script>
-- Theme check (add-on windows work with the default UI and with the Steampunk
-- UI theme). Steampunk is installed when styles/steampunk.css exists; then this
-- window gets the class sp-theme-steampunk and uses the Steampunk look,
-- otherwise sp-theme-default and the game's own look. SP_THEME says which.
pcall(function()
    local sp = false
    pcall(function()
        local f = io.open('Data/ui/themes/rose/styles/steampunk.css', 'r')
        if f then f:close(); sp = true end
    end)
    SP_THEME = sp and 'steampunk' or 'default'
    local body = document:GetElementById('game-menu-hud')
    if body then
        body:SetClass('sp-theme-default', not sp)
        body:SetClass('sp-theme-steampunk', sp)
    end
    -- (parts written for the other look stay in the window, hidden)
end)
        </script>
    <script>
-- Add-ons button: opens and closes the Add-ons window (sp_addons_window.html),
-- where every installed add-on has its switch and settings, by section.
pcall(function()
    local document = document
    local PATH = 'data/ui/themes/rose/game/sp_addons_window.html'
    local btn = document:GetElementById('sp-addons-btn')
    if not btn then return end
    btn:AddEventListener('click', function()
        pcall(function()
            local ctx = document.context
            local d = ctx.documents['sp-addons-window'] or ctx:LoadDocument(PATH)
            if not d then return end
            local vis = false
            pcall(function() vis = d:IsVisible() end)
            if vis then d:Hide() else d:Show() end
        end)
    end)
end)
    </script>
    </head>
