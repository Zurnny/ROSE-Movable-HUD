        <script>
-- Theme check (add-on windows work with the default UI and with the Steampunk
-- UI theme). Steampunk is installed when styles/steampunk.css exists; then this
-- window gets the class sp-theme-steampunk and uses the Steampunk look,
-- otherwise sp-theme-default and the game's own look. SP_THEME says which.
pcall(function()
    local sp = false
    pcall(function()
        local f = io.open('Data/ui/themes/rose/styles/steampunk.css', 'r')
        if f then f:close(); sp = true end
    end)
    SP_THEME = sp and 'steampunk' or 'default'
    local body = document:GetElementById('sp-addons-window')
    if body then
        body:SetClass('sp-theme-default', not sp)
        body:SetClass('sp-theme-steampunk', sp)
    end
    -- (parts written for the other look stay in the window, hidden)
end)
        </script>

        <script>
-- Chat message colours (Message Colours add-on). Shared by options_bgfx.html (the
-- picker) and chat_box.html (the messages). Written inline because the game
-- ignores edited .lua files. Choices are saved to sp_chat_colors.txt.
local CHANNELS = {{id='chat', name='Chat', default='rgb(255, 255, 255)'}, {id='shout', name='Shout', default='rgb(255, 105, 105)'}, {id='whisper', name='Whisper', default='rgb(255, 158, 232)'}, {id='trade', name='Trade', default='rgb(0, 210, 50)'}, {id='party', name='Party', default='rgb(189, 250, 255)'}, {id='clan', name='Clan', default='rgb(255, 228, 122)'}, {id='group', name='Group', default='rgb(156, 175, 243)'}, {id='leader', name='Group Leader', default='rgb(87, 124, 221)'}, {id='quest', name='Quest', default='rgb(151, 221, 241)'}, {id='system', name='System', default='rgb(255, 224, 229)'}}
local PALETTE = {{name='White', rgb='rgb(255, 255, 255)'}, {name='Parchment', rgb='rgb(226, 208, 170)'}, {name='Brass', rgb='rgb(214, 170, 96)'}, {name='Gold', rgb='rgb(255, 215, 90)'}, {name='Copper', rgb='rgb(205, 120, 60)'}, {name='Orange', rgb='rgb(255, 150, 60)'}, {name='Red', rgb='rgb(255, 90, 80)'}, {name='Pink', rgb='rgb(255, 150, 220)'}, {name='Purple', rgb='rgb(190, 150, 255)'}, {name='Blue', rgb='rgb(120, 170, 255)'}, {name='Cyan', rgb='rgb(120, 230, 240)'}, {name='Green', rgb='rgb(110, 220, 110)'}}
local SAVE_FILE = 'sp_chat_colors.txt'
local CHAT_ID = 'game-chat-box'
local picks = {}   -- channel id -> palette index (0 = game default)
pcall(function()
    local f = io.open(SAVE_FILE, 'r')
    if not f then return end
    for line in f:lines() do
        local k, v = line:match('^%s*([%w_]+)%s*=%s*(%d+)')
        if k then picks[k] = math.max(0, math.min(#PALETTE, tonumber(v))) end
    end
    f:close()
end)
if _G and type(_G.SP_CHAT_PICKS) == 'table' then
    for k, v in pairs(_G.SP_CHAT_PICKS) do if picks[k] == nil then picks[k] = v end end
end
local function save()
    if _G then _G.SP_CHAT_PICKS = picks end
    pcall(function()
        local f = io.open(SAVE_FILE, 'w')
        if not f then return end
        for _, c in ipairs(CHANNELS) do f:write(c.id, '=', tostring(picks[c.id] or 0), '\n') end
        f:close()
    end)
end
-- Put class sp-<channel>-<n> on the chat window body
local function apply_to(doc)
    if not doc then return false end
    local body = doc:GetElementById(CHAT_ID)
    if not body then return false end
    for _, c in ipairs(CHANNELS) do
        for i = 1, #PALETTE do body:SetClass('sp-' .. c.id .. '-' .. i, (picks[c.id] or 0) == i) end
    end
    return true
end

local ok, err = pcall(function()
    local box = document:GetElementById('sp-chat-colors')
    if not box then return end
    local function colour_of(c)
        local i = picks[c.id] or 0
        return i > 0 and PALETTE[i].rgb or c.default
    end
    local function render()
        local rows = {}
        for _, c in ipairs(CHANNELS) do
            local cells = {'<button class="default ui-compact sp-swatch-default' .. (((picks[c.id] or 0) == 0) and ' selected' or '') ..
                '" sp-chan="' .. c.id .. '" sp-col="0">Default</button>'}
            for i, p in ipairs(PALETTE) do
                cells[#cells + 1] = '<span class="sp-swatch' .. ((picks[c.id] == i) and ' selected' or '') ..
                    '" sp-chan="' .. c.id .. '" sp-col="' .. i .. '" style="background-color: ' .. p.rgb .. ';" tooltip="' .. p.name .. '"></span>'
            end
            rows[#rows + 1] = '<tr><td><span class="sp-chat-sample" style="color: ' .. colour_of(c) .. ';">' .. c.name ..
                '</span></td><td><div class="sp-swatch-row">' .. table.concat(cells) .. '</div></td></tr>'
        end
        box.inner_rml = '<table class="main"><tbody>' .. table.concat(rows) .. '</tbody></table>'
    end
    local function push()
        local dbg = document:GetElementById('sp-chat-colors-status')
        local reached = false
        if _G and type(_G.SP_CHAT_APPLY) == 'function' then reached = pcall(_G.SP_CHAT_APPLY, picks) end
        if not reached then
            pcall(function()
                local ctx = document.context
                reached = apply_to(ctx.documents[CHAT_ID])
                if not reached then
                    for i = 0, #ctx.documents - 1 do
                        if apply_to(ctx.documents[i]) then reached = true break end
                    end
                end
            end)
        end
        if dbg then dbg.inner_rml = reached and '' or 'Saved. The chat will use these colours after a restart.' end
    end
    box:AddEventListener('click', function(event)
        local t = event.target_element
        while t and t ~= box do
            local chan, col = t:GetAttribute('sp-chan'), tonumber(t:GetAttribute('sp-col'))
            if chan and col then
                picks[chan] = col
                save()
                render()
                push()
                event:StopPropagation()
                return
            end
            t = t.parent_node
        end
    end)
    render()
    push()
end)
if not ok then
    local d = document:GetElementById('sp-chat-colors-status')
    if d then d.inner_rml = ('Lua error: ' .. tostring(err)):gsub('&', '&amp;'):gsub('<', '&lt;') end
end

    
        </script>
        <script>
-- "Bring all windows on screen" (Window Rescue add-on). Moves any window that sits
-- partly or fully outside the game window back inside it. Windows already on
-- screen, and full-screen layers (names, labels), are left alone.
local ok, err = pcall(function()
    local button = document:GetElementById('sp-windows-onscreen')
    local status = document:GetElementById('sp-windows-status')
    if not button then return end
    local function each(list, fn)
        if not list then return end
        local i = list[0] and 0 or 1
        while list[i] do fn(list[i]); i = i + 1 end
    end
    button:AddEventListener('click', function()
        local moved, checked = 0, 0
        local ok2, err2 = pcall(function()
            local ctx = document.context
            local W, H = ctx.dimensions.x, ctx.dimensions.y
            each(ctx.documents, function(doc)
                local w, h = doc.offset_width or 0, doc.offset_height or 0
                if w <= 0 or h <= 0 or w >= W * 0.9 or h >= H * 0.9 then return end   -- skip empty and full-screen layers
                checked = checked + 1
                local x, y = doc.offset_left or 0, doc.offset_top or 0
                local nx = math.max(0, math.min(W - w, x))
                local ny = math.max(0, math.min(H - h, y))
                if nx ~= x or ny ~= y then
                    doc.style.left = math.floor(nx) .. 'px'
                    doc.style.top = math.floor(ny) .. 'px'
                    moved = moved + 1
                end
            end)
        end)
        if status then
            if not ok2 then status.inner_rml = ('Could not move windows: ' .. tostring(err2)):gsub('&', '&amp;'):gsub('<', '&lt;')
            elseif moved == 0 then status.inner_rml = 'All ' .. checked .. ' windows are already on screen.'
            else status.inner_rml = 'Moved ' .. moved .. (moved == 1 and ' window' or ' windows') .. ' back on screen.' end
        end
    end)
end)
    
        </script>
        <script>
-- Heading-up minimap switch (steampunk add-on). The minimap window does the
-- turning; this checkbox tells it to (through _G.SP_MINIMAP_SET) and the choice
-- is saved in sp_minimap.txt, which the minimap reads when it loads.
pcall(function()
    local document = document
    local box = document:GetElementById('sp-mm-heading-up')
    local status = document:GetElementById('sp-mm-status')
    if not box then return end
    local on = false
    pcall(function()
        if _G and type(_G.SP_MINIMAP_GET) == 'function' then on = _G.SP_MINIMAP_GET() and true or false; return end
        local f = io.open('sp_minimap.txt', 'r')
        if f then on = (f:read('*l') or ''):match('heading_up%s*=%s*1') ~= nil; f:close() end
    end)
    if on then box:SetAttribute('checked', '') else box:RemoveAttribute('checked') end
    box:AddEventListener('change', function()
        local want = box:HasAttribute('checked')
        if _G and type(_G.SP_MINIMAP_SET) == 'function' then
            _G.SP_MINIMAP_SET(want)
            if status then status.inner_rml = '' end
        else
            pcall(function()
                local f = io.open('sp_minimap.txt', 'w')
                if f then f:write('heading_up=', want and 1 or 0, '\n'); f:close() end
            end)
            if status then status.inner_rml = 'Saved. The minimap will use this after a restart.' end
        end
    end)
end)
    
        </script>
        <script>
-- (runs only in the Steampunk look)
if SP_THEME ~= 'steampunk' then return end
-- Element chart switch (steampunk add-on). Saved in sp_element_chart.txt; the
-- minimap reads it every 2 seconds (and straight away when windows can share).
pcall(function()
    local document = document
    local box = document:GetElementById('sp-el-chart-on')
    if not box then return end
    local on = true
    pcall(function()
        local f = io.open('sp_element_chart.txt', 'r')
        if f then on = (f:read('*l') or ''):match('show%s*=%s*0') == nil; f:close() end
    end)
    if on then box:SetAttribute('checked', '') else box:RemoveAttribute('checked') end
    box:AddEventListener('change', function()
        local want = box:HasAttribute('checked')
        pcall(function()
            local f = io.open('sp_element_chart.txt', 'w')
            if f then f:write('show=', want and 1 or 0, '\n'); f:close() end
        end)
        pcall(function() if type(_G) == 'table' and type(_G.SP_ELEMENT_CHART_APPLY) == 'function' then _G.SP_ELEMENT_CHART_APPLY() end end)
    end)
end)

        <script>
-- Add-on switches and settings (shared: every add-on with a switch ships this
-- same window, so it doesn't matter which or how many are installed). Each
-- installed add-on puts its marker in Data/ui/sp_addons/ (the launcher removes
-- it with the add-on); only installed add-ons show, in their section, and a
-- section shows only while something in it does.
-- The switches are saved in sp_addons.txt as key=0/1. The Ice UI uses that
-- file too, so every line is kept as it is and in the same order; only the
-- switch that was changed is rewritten.
pcall(function()
    local document = document
    local FLAGS = 'sp_addons.txt'
    -- sections of the Add-Ons tab (in this order)
    local CATS = {'combat', 'hud', 'social', 'items', 'chat', 'map'}
    -- add-ons with an on/off switch: key, switch text, add-on name, section (listed in this order)
    local SWITCHES = {
        {'dps_meter', 'DPS meter under the target', 'DPS Meter', 'combat'},
        {'mob_levels', 'Monster level above monster names', 'Monster Levels', 'combat'},
        {'summon_extras', 'Summon HP, range and low-HP warning', 'Summon Gauge Plus', 'combat'},
        {'exp_tracker', 'EXP per hour when hovering the EXP bar', 'EXP Tracker', 'hud'},
        {'weapon_slot', 'Weapon slot beside the HUD bars, with its durability kept up to date', 'HUD Weapon Slot', 'hud'},
        {'hud_move', 'Move the HUD by holding its footer', 'Movable HUD', 'hud'},
        {'friend_levels', 'Remembered levels in the friend and group lists', 'Friend Levels', 'social'},
        {'class_icons', 'Class icons in party and group', 'Class Icons', 'social'},
        {'party_buffs', 'Buff icon options in party and group', 'Party Buff Options', 'social'},
        {'craft_max', 'Max button in the crafting window', 'Craft Max', 'items'},
        {'minimap_compass', 'Compass ring round the minimap', 'Minimap Window', 'map'},
        {'minimap_pad', 'Window under the minimized minimap', 'Minimap Window', 'map'},
    }
    -- add-ons with settings of their own: key, id of those settings, section
    local SECTIONS = {
        {'msg_colors', 'sp-sec-msg_colors', 'chat'},
        {'window_rescue', 'sp-sec-window_rescue', 'map'},
        {'minimap_compass', 'sp-sec-minimap', 'map'},
    }
    local function el(id) return document:GetElementById(id) end
    local function installed(key)
        local yes = true      -- if the game won't let the UI read files, show everything
        pcall(function()
            local f = io.open('Data/ui/sp_addons/' .. key .. '.txt', 'r')
            if f then f:close() else yes = false end
        end)
        return yes
    end
    -- sp_addons.txt: every line kept, in order
    local function read_flags()
        local vals, order = {}, {}
        pcall(function()
            local f = io.open(FLAGS, 'r')
            if not f then return end
            for line in f:lines() do
                local k, v = line:match('^%s*([%w_]+)%s*=%s*(%d+)')
                if k then
                    if vals[k] == nil then order[#order + 1] = k end
                    vals[k] = v
                end
            end
            f:close()
        end)
        return vals, order
    end
    local function set_flag(key, on)
        local vals, order = read_flags()
        if vals[key] == nil then order[#order + 1] = key end
        vals[key] = on and '1' or '0'
        local ok = pcall(function()
            local f = assert(io.open(FLAGS, 'w'))
            for _, k in ipairs(order) do f:write(k, '=', vals[k], '\n') end
            f:close()
        end)
        local st = el('sp-addon-status')
        if st and not ok then st.inner_rml = 'Could not save the switch.' end
    end
    local shown = nil
    local function build()
        local body = el('sp-addons-window')
        local vals = read_flags()
        local used = {map = SP_THEME == 'steampunk'}   -- (Steampunk's own minimap settings sit in Map & Windows)
        for _, s in ipairs(SECTIONS) do
            local on = SP_THEME == 'steampunk' or installed(s[1])   -- Steampunk has these built in
            local sec = el(s[2])
            if sec then sec:SetClass('sp-shown', on) end
            if body then body:SetClass('sp-has-' .. s[1], on) end
            if on then used[s[3]] = true end
        end
        local items, sig = {}, {}
        for _, it in ipairs(SWITCHES) do
            -- the Steampunk UI theme shows its own element chart instead of the Minimap Window
            if installed(it[1]) and not (SP_THEME == 'steampunk' and it[1] == 'minimap_pad') then
                items[#items + 1] = it
                sig[#sig + 1] = it[1] .. (vals[it[1]] == '0' and '0' or '1')
            end
        end
        for _, it in ipairs(items) do used[it[4]] = true end
        local any = false
        for _, c in ipairs(CATS) do
            local sec = el('sp-cat-' .. c)
            if sec then sec:SetClass('sp-shown', used[c] == true) end
            if used[c] then any = true end
        end
        if body then body:SetClass('sp-aw-none', not any) end
        sig = table.concat(sig, ',')
        if sig == shown then return end
        shown = sig
        local rows = {}
        for _, c in ipairs(CATS) do rows[c] = {} end
        for _, it in ipairs(items) do
            local r = rows[it[4]]
            r[#r + 1] = '<div class="sp-addon-row"><input id="sp-addon-' .. it[1] .. '" type="checkbox"'
                .. (vals[it[1]] == '0' and '' or ' checked=""') .. ' /><label for="sp-addon-' .. it[1] .. '">'
                .. it[2] .. ' <span class="sp-addon-name">(' .. it[3] .. ')</span></label></div>'
        end
        for _, c in ipairs(CATS) do
            local list = el('sp-list-' .. c)
            if list then list.inner_rml = table.concat(rows[c]) end
        end
        for _, it in ipairs(items) do
            local k = it[1]
            local box = el('sp-addon-' .. k)
            if box then
                box:AddEventListener('change', function()
                    set_flag(k, box:HasAttribute('checked'))
                    shown = nil
                end)
            end
        end
        local st = el('sp-addon-status')
        if st then st.inner_rml = 'A change shows within about 2 seconds.' end
    end
    pcall(build)
    document:AddEventListener('show', function() pcall(build) end)
end)
    
        </script>
